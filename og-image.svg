<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .tabular { font-feature-settings: "tnum"; font-variant-numeric: tabular-nums; }
    </style>
  </defs>

  <!-- Background Canvas: Warm Paper -->
  <rect width="1200" height="630" fill="#f7f4ee"/>

  <!-- Inner Enclosure Card: Surface with subtle border -->
  <rect x="40" y="40" width="1120" height="550" rx="24" fill="#fffdf8" stroke="#e6e0d3" stroke-width="2"/>

  <!-- Top Brand Lockup -->
  <g transform="translate(80, 80)">
    <!-- Brand Icon Container -->
    <rect width="56" height="56" rx="14" fill="#e4efe7"/>
    <!-- Building & Ledger Icon -->
    <g transform="translate(13, 13) scale(1.25)">
      <path d="M3 9.5 12 3l9 6.5" fill="none" stroke="#35674a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M5 8.5V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8.5" fill="none" stroke="#35674a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M8 10.5h8" stroke="#35674a" stroke-width="2" stroke-linecap="round"/>
      <path d="M8 13.5h8" stroke="#35674a" stroke-width="2" stroke-linecap="round"/>
      <path d="M10 21v-3.5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1V21" fill="none" stroke="#35674a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Wordmark -->
    <text x="72" y="39" class="font-sans" font-size="34" font-weight="800" letter-spacing="-0.03em" fill="#221e19">kosuka</text>

    <!-- Category Pill -->
    <rect x="200" y="14" width="165" height="28" rx="14" fill="#e4efe7"/>
    <text x="214" y="33" class="font-sans" font-size="13" font-weight="700" fill="#35674a">Buku Tagihan Digital</text>
  </g>

  <!-- Main Hero Headline -->
  <g transform="translate(80, 210)">
    <text x="0" y="0" class="font-sans" font-size="46" font-weight="800" letter-spacing="-0.03em" fill="#221e19">Buku tagihan kos yang tenang,</text>
    <text x="0" y="58" class="font-sans" font-size="46" font-weight="800" letter-spacing="-0.03em" fill="#221e19">akurat, dan siap kirim.</text>

    <text x="0" y="118" class="font-sans" font-size="20" font-weight="400" fill="#6f6759">Catat kamar, buat tagihan bulanan dalam 1 menit, dan kelola pembayaran</text>
    <text x="0" y="148" class="font-sans" font-size="20" font-weight="400" fill="#6f6759">tanpa kerumitan akuntansi. Bekerja offline-first di perangkat Anda.</text>
  </g>

  <!-- Mini Sample Invoice Card (Visual Anchor) -->
  <g transform="translate(790, 80)">
    <rect width="330" height="380" rx="18" fill="#f7f4ee" stroke="#e6e0d3" stroke-width="1.5"/>

    <!-- Invoice Header -->
    <text x="24" y="38" class="font-sans tabular" font-size="13" font-weight="600" fill="#6f6759">INV-GD-2026-0012</text>
    <rect x="240" y="22" width="66" height="24" rx="12" fill="#e4efe7"/>
    <text x="253" y="38" class="font-sans" font-size="12" font-weight="700" fill="#35674a">Lunas</text>

    <!-- Tenant & Room -->
    <text x="24" y="78" class="font-sans" font-size="18" font-weight="700" fill="#221e19">Kamar 102</text>
    <text x="24" y="98" class="font-sans" font-size="14" font-weight="500" fill="#6f6759">Budi Santoso</text>

    <!-- Divider -->
    <line x1="24" y1="118" x2="306" y2="118" stroke="#e6e0d3" stroke-width="1.5"/>

    <!-- Line Items -->
    <text x="24" y="148" class="font-sans" font-size="14" font-weight="500" fill="#221e19">Sewa Kamar (Sep 2026)</text>
    <text x="306" y="148" class="font-sans tabular" font-size="14" font-weight="600" text-anchor="end" fill="#221e19">Rp 1.300.000</text>

    <text x="24" y="178" class="font-sans" font-size="14" font-weight="500" fill="#221e19">Listrik &amp; Air</text>
    <text x="306" y="178" class="font-sans tabular" font-size="14" font-weight="600" text-anchor="end" fill="#221e19">Rp 150.000</text>

    <!-- Dashed divider -->
    <line x1="24" y1="210" x2="306" y2="210" stroke="#d4ccba" stroke-width="1.5" stroke-dasharray="4 4"/>

    <!-- Total -->
    <text x="24" y="244" class="font-sans" font-size="14" font-weight="600" fill="#6f6759">Total Tagihan</text>
    <text x="306" y="248" class="font-sans tabular" font-size="24" font-weight="800" text-anchor="end" fill="#35674a">Rp 1.450.000</text>

    <!-- Footer of card -->
    <rect x="24" y="278" width="282" height="76" rx="12" fill="#fffdf8" stroke="#e6e0d3" stroke-width="1"/>
    <circle cx="44" cy="304" r="4" fill="#3f7a58"/>
    <text x="56" y="308" class="font-sans" font-size="13" font-weight="600" fill="#221e19">Dibayar lunas via Transfer</text>
    <text x="56" y="334" class="font-sans tabular" font-size="12" font-weight="500" fill="#6f6759">1 Sep 2026 · 09:42 WIB</text>
  </g>

  <!-- Bottom Feature Badges / Trust Pills -->
  <g transform="translate(80, 488)">
    <!-- Pill 1: Offline-First -->
    <g transform="translate(0, 0)">
      <rect width="145" height="38" rx="19" fill="#f7f4ee" stroke="#e6e0d3" stroke-width="1.5"/>
      <circle cx="20" cy="19" r="4" fill="#3f7a58"/>
      <text x="32" y="24" class="font-sans" font-size="14" font-weight="600" fill="#221e19">Offline-First</text>
    </g>

    <!-- Pill 2: Data Tersimpan Lokal -->
    <g transform="translate(160, 0)">
      <rect width="185" height="38" rx="19" fill="#f7f4ee" stroke="#e6e0d3" stroke-width="1.5"/>
      <circle cx="20" cy="19" r="4" fill="#3f7a58"/>
      <text x="32" y="24" class="font-sans" font-size="14" font-weight="600" fill="#221e19">Data Privat &amp; Aman</text>
    </g>

    <!-- Pill 3: Google Drive Sync -->
    <g transform="translate(360, 0)">
      <rect width="195" height="38" rx="19" fill="#f7f4ee" stroke="#e6e0d3" stroke-width="1.5"/>
      <circle cx="20" cy="19" r="4" fill="#3f7a58"/>
      <text x="32" y="24" class="font-sans" font-size="14" font-weight="600" fill="#221e19">Google Drive Sync</text>
    </g>

    <!-- Pill 4: WhatsApp Sharing -->
    <g transform="translate(570, 0)">
      <rect width="180" height="38" rx="19" fill="#f7f4ee" stroke="#e6e0d3" stroke-width="1.5"/>
      <circle cx="20" cy="19" r="4" fill="#3f7a58"/>
      <text x="32" y="24" class="font-sans" font-size="14" font-weight="600" fill="#221e19">Kirim via WhatsApp</text>
    </g>
  </g>
</svg>